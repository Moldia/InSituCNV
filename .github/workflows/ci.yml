name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -m "not network"

  notebook:
    name: Notebook runs end to end
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Build the offline example dataset
        run: python scripts/synthetic_example_dataset.py "${RUNNER_TEMP}/example.h5ad"
      - name: Execute notebook
        env:
          INSITUCNV_EXAMPLE_H5AD: ${{ runner.temp }}/example.h5ad
        run: pytest --nbmake notebooks/run_insitucnv.ipynb

  build:
    name: Docs and package build
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev,docs]"

      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html

      - name: Build distributions
        run: python -m build
