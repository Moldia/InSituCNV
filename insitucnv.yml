# Convenience conda environment for InSituCNV development.
# pyproject.toml is the source of truth for runtime dependencies; this file just
# provides the compiled/system packages plus JupyterLab. After creating the env,
# run `pip install -e ".[dev,docs]"` to install InSituCNV and its Python deps.
name: insitucnv_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - h5py
  - jupyterlab
  - python-igraph
  - leidenalg
  - zarr<3
  - pip:
      - -e ".[dev,docs]"
