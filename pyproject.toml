[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insitucnv"
dynamic = ["version"]
description = "Reusable tools for in situ CNV inference in image-based spatial transcriptomics."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Augusta Jensen", email = "augusta.jensen@scilifelab.se" }
]
keywords = [
  "copy-number-variation",
  "spatial-transcriptomics",
  "single-cell",
  "bioinformatics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.10,<0.12",
  "infercnvpy>=0.6.0",
  "igraph>=0.11",
  "leidenalg>=0.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1,<3",
  "scanpy>=1.10",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "scvelo>=0.3.3",
  "seaborn>=0.13",
  "tqdm>=4.66"
]

[project.optional-dependencies]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "myst-nb>=1.0",
  "ipython>=8.0",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "nbmake>=1.5",
  "ruff>=0.6",
  "twine>=5.0",
]

[project.scripts]
insitucnv = "insitucnv.cli:main"

[project.urls]
Homepage = "https://github.com/Moldia/InSituCNV"
Documentation = "https://insitucnv.readthedocs.io/"
Repository = "https://github.com/Moldia/InSituCNV"
Issues = "https://github.com/Moldia/InSituCNV/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "insitucnv.__about__.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["insitucnv*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "network: test requires network access (deselected by default with -m 'not network')",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs", "*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
"insitucnv/cli.py" = ["E501"]
